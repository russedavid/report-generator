name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate corpus provenance and coverage
        run: python -m evals.corpus_tools
      - name: Run offline tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Prepare paired requests without inference
        run: python -m evals.pilot --prepare
      - name: Compare reference retrieval without inference
        run: python -m evals.check_retrieval --output "$RUNNER_TEMP/frontline-retrieval"
